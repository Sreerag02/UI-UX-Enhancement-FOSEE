{% extends 'workshop_app/base.html' %}

{% block title %}
    Awaiting activation

{% block content %}
    <script type="text/javascript">
        // Redirect to React activation page with status
        var status = '{{ status|default:"pending" }}';
        window.location.href = '/activate?status=' + status;
    </script>
    <div class="container">
        <div class="jumbotron">
            <p>Redirecting...</p>
        </div>
    </div>
{% endblock %}
